<!doctype html>
<html lang="{{ site.active_lang | default: page.lang | default: site.default_lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6fb7a6">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% I18n_Headers %}
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/archive.css">
  <link rel="stylesheet" href="/assets/css/i18n.css">
</head>
<body>
  <header class="site-masthead">
    <div class="shell masthead-inner">
      <a class="masthead-title" href="/">简记·思行-SiNZeRo</a>
      <div class="masthead-tagline">Sunshine and Imagination</div>
    </div>
  </header>

  <nav class="site-nav" aria-label="Primary">
    <div class="shell nav-shell">
      <div class="top-nav">
        <a href="/">Home</a>
        <a href="/ai-slops/">AI Slops</a>
        <a href="/myself/">Myself</a>
        <a href="/legacy/">Legacy</a>
        <a href="https://github.com/SiNZeRo">GitHub</a>
      </div>
    </div>
  </nav>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="shell footer-row">
      <span>SiNZeRo · notes in motion</span>
      <a href="/legacy/">Old site</a>
    </div>
  </footer>
</body>
</html>
